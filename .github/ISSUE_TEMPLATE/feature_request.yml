name: ✨ Feature Request
description: Suggest a new feature or abstraction for the library
title: "[FEATURE] "
labels: [enhancement, needs-review]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Have an idea to improve EVHardware? We'd love to hear it!

        **Before requesting:** Please check if a similar feature has been requested in [Discussions](https://github.com/malys/EVHardware/discussions).

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submission checks"
      description: "Ensure you've done these before submitting"
      options:
        - label: I've checked existing issues/discussions and found no duplicate
          required: true
        - label: This feature adds value to the library for multiple consumer projects
          required: true
        - label: I understand this project is not affiliated with SAIC/MG Motor
          required: false

  - type: input
    id: title
    attributes:
      label: "Feature Title"
      description: "Clear, concise name for the feature"
      placeholder: "Add firmware-aware property caching layer"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: |
        What problem does this solve? Why is it needed?
        - Current limitation
        - Use case in dependent projects
        - How this improves the library
      placeholder: |
        Consumer projects repeatedly read the same vehicle properties.
        CarPropertyManager is thread-blocking; reads slow down UI threads.
        A cached property layer would improve performance across all projects.
      rows: 5
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: |
        How should this feature work?
        - New classes / APIs
        - Firmware compatibility
        - Integration with existing adapters
      placeholder: |
        1. Add CachedCarPropertyManager extending CarPropertyManager
        2. Cache properties with configurable TTL (default 100ms)
        3. Support firmware-specific property ID mappings
        4. Integrate with existing CarPropertyAdapter classes
      rows: 6
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Have you considered other ways to solve this?"
      placeholder: |
        - Alternative 1: Modify consumer projects to cache locally
        - Pro: no library changes
        - Con: duplicate caching logic across projects
      rows: 4

  - type: dropdown
    id: impact
    attributes:
      label: "Expected Adoption"
      description: "How many consumer projects would use this?"
      options:
        - "1 project (EVProfile / EVABRPUploader / launcher)"
        - "2–3 projects (multiple consumers)"
        - "All projects (core library feature)"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: "Estimated Complexity"
      description: "How much work is this?"
      options:
        - "Small (< 1 day)"
        - "Medium (1–3 days)"
        - "Large (1–2 weeks)"
        - "Unknown"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "How will we know this feature is done?"
      placeholder: |
        - [ ] CachedCarPropertyManager class implemented with configurable TTL
        - [ ] Firmware-aware property mapping works across SWI132–SWI165
        - [ ] Integration tests verify cache invalidation on updates
        - [ ] Consumer projects can opt-in without code changes
        - [ ] Documentation updated with usage examples
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this project is not affiliated with SAIC/MG Motor and carries no warranty (see DISCLAIMER.md)
          required: true
